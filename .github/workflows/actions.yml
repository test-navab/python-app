name: Build, Push, and Deploy

on:
  push:
    branches: ['beta', 'master']
env:
  AWS_DEFAULT_REGION: "eu-central-1"


jobs:
  build:
    runs-on: self-hosted
    permissions:
      id-token: write
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Login to GitHub Container Registry
      env:
        CR_PAT_SECRET: ${{ secrets.CR_PAT }}
      run: echo $CR_PAT_SECRET | docker login ghcr.io -u ${{ secrets.CR_PAT_USERNAME }} --password-stdin

    #   # Clone submodules
    # - name: Clone additional repositories
    #   run: |
        
    #     cd src/common/models

    #     rm -rf workbench

    #     git clone https://${{ secrets.CR_PAT }}@github.com/devEdexa/account-workbench.git workbench


    # - name: Login to GitHub Container Registry
    #   env:
    #     CR_PAT_SECRET: ${{ secrets.CR_PAT }}
    #   run: echo $CR_PAT_SECRET | docker login ghcr.io -u ${{ secrets.CR_PAT_USERNAME }} --password-stdin


    - name: Set image tags
      id: vars
      run: |
        echo "commit_sha=$(echo $GITHUB_SHA | head -c 8)" >> $GITHUB_ENV

    - name: Set Docker Tags
      id: docker-metadata
      uses: docker/metadata-action@v4
      with:
        images: |
          ghcr.io/devEdexa/${{ github.event.repository.name }}-${{ github.ref_name }}
        tags: |
          ${{ env.commit_sha }}

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v3
      with:
        context: .
        push: true
        tags: ${{ steps.docker-metadata.outputs.tags }}
        labels: ${{ steps.docker-metadata.outputs.labels }}


